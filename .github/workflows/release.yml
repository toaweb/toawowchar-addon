# A release: pushing a tag vX.Y.Z (by the owner, from main) builds the zip and publishes a GitHub
# Release with the zip, SHA256SUMS and the example exports. wowchar pins the release's asset URL:
#   https://github.com/toaweb/toawowchar-addon/releases/download/vX.Y.Z/toawowchar-X.Y.Z.zip
# GitHub-hosted runner only: this repository is public (DEPLOYMENT_STRATEGY standard).
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write                 # create the release; this job only
    steps:
      # The token is not left in .git/config (persist-credentials: false): the tests below run
      # the repository's own code. It reaches only the last step, as GH_TOKEN.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A release is made from main only: the tagged commit must be on it.
      - name: The tag is on main
        run: |
          set -eu
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main \
            || { echo "::error::${GITHUB_REF_NAME} is not on main; no release is made"; exit 1; }

      # The tag equals the version in the TOC, and the TOC, the Lua, the README and the CHANGELOG agree.
      - name: Check the tag against the version
        run: python3 scripts/check-version.py "${GITHUB_REF_NAME}"

      # Also writes dist/examples/*.txt, the example exports.
      - name: Tests
        run: scripts/test.sh

      - name: Build the zip
        run: python3 scripts/build-zip.py

      # The release assets: the zip, the examples and SHA256SUMS over both. The notes are the
      # CHANGELOG section of this version.
      - name: Collect the assets and the notes
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          zip="toawowchar-${version}.zip"
          mkdir release
          cp "dist/${zip}" release/
          cp dist/examples/*.txt release/
          test -f release/export-format-3.txt
          (cd release && sha256sum -- * > "${RUNNER_TEMP}/SHA256SUMS")
          mv "${RUNNER_TEMP}/SHA256SUMS" release/SHA256SUMS
          (cd release && sha256sum --check SHA256SUMS)
          awk -v v="${version}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            /^## \[/ || /^\[[^]]+\]: / { on = 0 }
            on
          ' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          test -s "${RUNNER_TEMP}/notes.md" || { echo "::error::CHANGELOG.md has no text for ${version}"; exit 1; }
          cat release/SHA256SUMS

      # `gh` is on the runner. It fails if the release already exists: a release is never overwritten.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/notes.md"
