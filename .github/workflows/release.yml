# A release: pushing a tag vX.Y.Z (by the owner, from main) builds the zip and publishes a GitHub
# Release with the zip, SHA256SUMS and the example exports. wowchar pins the release's asset URL:
#   https://github.com/toaweb/toawowchar-addon/releases/download/vX.Y.Z/toawowchar-X.Y.Z.zip
# GitHub-hosted runner only: this repository is public (DEPLOYMENT_STRATEGY standard).
#
# Two jobs, so that the token that can write a release never meets repository code:
#   build    contents: read. Runs the repository's own code (tests, build-zip.py) and hands the
#            files over as a workflow artifact.
#   publish  contents: write. No checkout, no repository code: it downloads the artifact, checks
#            it against SHA256SUMS and runs `gh release create`.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # No token is left in .git/config (persist-credentials: false), and the job has no write
      # permission at all: it runs the repository's own code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A release is made from main only: the tagged commit must be on it.
      - name: The tag is on main
        run: |
          set -eu
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main \
            || { echo "::error::${GITHUB_REF_NAME} is not on main; no release is made"; exit 1; }

      # The tag equals the version in the TOC, and the TOC, the Lua, the README and the CHANGELOG agree.
      - name: Check the tag against the version
        run: python3 scripts/check-version.py "${GITHUB_REF_NAME}"

      # Also writes dist/examples/*.txt, the example exports.
      - name: Tests
        run: scripts/test.sh

      - name: Build the zip
        run: python3 scripts/build-zip.py

      # The release assets: the zip, the examples and SHA256SUMS over both, in release/. The notes,
      # the CHANGELOG section of this version, are release-notes.md (not an asset).
      - name: Collect the assets and the notes
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          zip="toawowchar-${version}.zip"
          mkdir release
          cp "dist/${zip}" release/
          cp dist/examples/*.txt release/
          test -f release/export-format-3.txt
          (cd release && sha256sum -- * > "${RUNNER_TEMP}/SHA256SUMS")
          mv "${RUNNER_TEMP}/SHA256SUMS" release/SHA256SUMS
          (cd release && sha256sum --check SHA256SUMS)
          awk -v v="${version}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            /^## \[/ || /^\[[^]]+\]: / { on = 0 }
            on
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "::error::CHANGELOG.md has no text for ${version}"; exit 1; }
          cat release/SHA256SUMS

      # Exactly release/ and release-notes.md; the artifact keeps that layout (the common parent of
      # the two paths is the root). One day is enough: the publish job starts when this one ends.
      # actions/upload-artifact v7.0.2, the commit of that tag (a lightweight tag, so the tag's
      # object is the commit): resolved with `gh api repos/actions/upload-artifact/git/ref/tags/v7.0.2`.
      - name: Hand the files to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            release/
            release-notes.md
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write                 # create the release; this job only
    steps:
      # No checkout and no repository code in this job: it holds the write token. `gh` is on the
      # runner. actions/download-artifact v8.0.2, the commit of that tag (lightweight tag):
      # `gh api repos/actions/download-artifact/git/ref/tags/v8.0.2`.
      - name: Fetch the files of the build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: artifact

      # The files must be the ones SHA256SUMS lists and nothing else, and the zip must be the one
      # the tag names.
      - name: Verify the files
        run: |
          set -eu
          cd artifact/release
          sha256sum --check SHA256SUMS
          test -f "toawowchar-${GITHUB_REF_NAME#v}.zip"
          listed="$({ awk '{ print $2 }' SHA256SUMS; echo SHA256SUMS; } | LC_ALL=C sort)"
          present="$(find . -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)"
          test "${listed}" = "${present}" || { echo "::error::the artifact holds files SHA256SUMS does not list"; exit 1; }
          test -s ../release-notes.md

      # `gh release create` fails if the release already exists: a release is never overwritten.
      # There is no git checkout, so the repository is named.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "${GITHUB_REF_NAME}" artifact/release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file artifact/release-notes.md
